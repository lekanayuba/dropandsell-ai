    <script>
      // Block Replit's deployment-time feedback widget from ever loading.
      // The hosting platform injects a <script src="https://replit-cdn.com/feedback-widget/...">
      // at the bottom of <body>. We patch DOM insertion APIs and run a
      // MutationObserver so the script element is removed before the
      // browser can fetch it, and any UI it manages to create is wiped.
      (function () {
        var BLOCKED_HOST_PATTERNS = [
          'replit-cdn.com',
          'cdn.replit.com',
          'replit.com/feedback',
          'replit.dev/feedback',
        ];
        var BLOCKED_ELEMENT_SELECTORS = [
          '[id*="replit-feedback" i]',
          '[class*="replit-feedback" i]',
          '[id*="feedback-widget" i]',
          '[class*="feedback-widget" i]',
          '[data-deployment-id]',
          '[data-repl-id]',
          'script[src*="replit-cdn.com"]',
          'script[src*="cdn.replit.com"]',
        ];

        function looksBlocked(node) {
          if (!node || node.nodeType !== 1) return false;
          if (node.tagName === 'SCRIPT') {
            var src = node.getAttribute && node.getAttribute('src');
            if (src) {
              for (var i = 0; i < BLOCKED_HOST_PATTERNS.length; i++) {
                if (src.indexOf(BLOCKED_HOST_PATTERNS[i]) !== -1) return true;
              }
            }
          }
          if (node.hasAttribute && (node.hasAttribute('data-deployment-id') || node.hasAttribute('data-repl-id'))) {
            return true;
          }
          for (var j = 0; j < BLOCKED_ELEMENT_SELECTORS.length; j++) {
            try {
              if (node.matches && node.matches(BLOCKED_ELEMENT_SELECTORS[j])) return true;
            } catch (_) {}
          }
          return false;
        }

        function sweep(root) {
          if (!root || !root.querySelectorAll) return;
          for (var i = 0; i < BLOCKED_ELEMENT_SELECTORS.length; i++) {
            try {
              root.querySelectorAll(BLOCKED_ELEMENT_SELECTORS[i]).forEach(function (el) {
                el.remove();
              });
            } catch (_) {}
          }
        }

        // Wrap appendChild / insertBefore on Element so the blocked script
        // never makes it into the document tree (and therefore never loads).
        function wrap(method) {
          var original = Element.prototype[method];
          Element.prototype[method] = function (newNode) {
            try {
              if (looksBlocked(newNode)) {
                return newNode;
              }
            } catch (_) {}
            return original.apply(this, arguments);
          };
        }
        wrap('appendChild');
        wrap('insertBefore');

        function startObserver() {
          if (typeof MutationObserver === 'undefined') return;
          var obs = new MutationObserver(function (mutations) {
            for (var i = 0; i < mutations.length; i++) {
              var m = mutations[i];
              for (var j = 0; j < m.addedNodes.length; j++) {
                var n = m.addedNodes[j];
                if (looksBlocked(n)) {
                  try { n.remove(); } catch (_) {}
                } else if (n && n.nodeType === 1) {
                  sweep(n);
                }
              }
            }
          });
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }

        // Run sweeps continually so anything that slips past is removed quickly.
        sweep(document);
        startObserver();
        document.addEventListener('DOMContentLoaded', function () {
          sweep(document);
        });
        window.addEventListener('load', function () {
          sweep(document);
          setTimeout(function () { sweep(document); }, 250);
          setTimeout(function () { sweep(document); }, 1000);
          setTimeout(function () { sweep(document); }, 3000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
